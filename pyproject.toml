[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ess-pipeline"
version = "1.0.0"
description = "Masterarbeit: LLM-Twins von ESS-11-Befragten füllen den PVQ-21 aus – Bereinigung, Schwartz-Scores, LLM-Experiment und Auswertung"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "anthropic>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.uv]
# Getestete Versionen festhalten, damit uv.lock keine neueren Versionen auflöst
constraint-dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.8",
    "anthropic==1.0.0",
    "pyyaml==6.0.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[project.scripts]
ess-pipeline = "ess_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: braucht die ESS-Rohdaten und läuft ca. 30 s"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["veraltet"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Lange Berichtszeilen: Text der generierten Berichte, unverändert gelassen
"src/ess_pipeline/analysis/forschungsfragen*.py" = ["E501"]
